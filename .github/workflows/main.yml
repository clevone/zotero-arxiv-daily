name: Send emails daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: write

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    env:
      ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
      ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
      SENDER: ${{ secrets.SENDER }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      RECEIVER: ${{ secrets.RECEIVER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
      CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4

      - name: Write custom config
        run: |
          echo "Use custom config:"
          echo "$CUSTOM_CONFIG"
          mkdir -p config
          printf "%s\n" "$CUSTOM_CONFIG" > config/custom.yaml

      - name: Run script
        run: uv run src/zotero_arxiv_daily/main.py

      - name: Persist recommendation state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_history.json data/preprint_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No recommendation state changes to commit."
          else
            git commit -m "chore: update recommendation state [skip ci]"
            git push
          fi
